name: Tests
on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Vendor/**"
      - "Resources/**"
      - "Package.swift"
      - "Package.resolved"
      - "Info.plist"
      - "build.sh"
      - "script/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Vendor/**"
      - "Resources/**"
      - "Package.swift"
      - "Package.resolved"
      - "Info.plist"
      - "build.sh"
      - "script/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift test
